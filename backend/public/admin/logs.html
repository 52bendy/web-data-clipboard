<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="csrf-token" content="{{CSRF_TOKEN}}" />
    <title>日志看板 · 网络剪切板</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <a class="brand" href="/admin">
        <span class="brand-mark" aria-hidden="true">DCC</span>
        <span class="brand-name">网络剪切板 · 管理后台</span>
      </a>
      <nav class="topnav" aria-label="后台导航">
        <a href="/admin">概览</a>
        <a href="/admin/devices">设备</a>
        <a class="active" href="/admin/logs">日志</a>
        <a href="/admin/settings">设置</a>
      </nav>
      <div class="session">
        <span class="session-user">{{USERNAME}}</span>
        <form method="post" action="/admin/logout">
          <input type="hidden" name="_csrf" value="{{CSRF_TOKEN}}" />
          <button class="btn btn-ghost" type="submit">退出登录</button>
        </form>
      </div>
    </header>

    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Collection log</p>
        <h1>日志看板</h1>
        <p class="muted">
          按设备、日期与关键字筛选采集历史；分页浏览，发送人按脱敏模式展示。
        </p>
      </section>

      <section class="panel">
        <form class="toolbar toolbar-wrap" id="filters">
          <label class="field field-inline">
            <span>设备</span>
            <input id="device" type="search" placeholder="设备 ID 或名称" autocomplete="off" />
          </label>
          <label class="field field-inline">
            <span>日期</span>
            <input id="date" type="date" />
          </label>
          <label class="field field-inline">
            <span>关键字</span>
            <input id="keyword" type="search" placeholder="发送人 / 内容 / 提取码" autocomplete="off" />
          </label>
          <label class="field field-inline">
            <span>每页</span>
            <select id="page-size">
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <label class="check">
            <input id="show-raw" type="checkbox" />
            <span>显示原文（关闭脱敏）</span>
          </label>
          <button class="btn btn-primary" type="submit">查询</button>
          <button class="btn" id="reset" type="button">重置</button>
        </form>
        <p class="alert" id="message" hidden></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>接收时间</th>
                <th>设备</th>
                <th>平台</th>
                <th>发送人</th>
                <th>内容</th>
                <th>提取码</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="log-rows"></tbody>
          </table>
        </div>
        <p class="empty" id="empty" hidden>没有符合条件的日志。</p>
        <div class="pager">
          <button class="btn" id="prev" type="button">上一页</button>
          <span class="muted" id="page-info">—</span>
          <button class="btn" id="next" type="button">下一页</button>
        </div>
      </section>
    </main>

    <script src="/admin/app.js"></script>
    <script src="/admin/logs.js"></script>
  </body>
</html>
